name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race on the concurrent packages)
        run: go test -race ./internal/scrape/ ./internal/store/ ./internal/serve/
      - name: test (all)
        run: go test ./...
      - name: build
        run: go build -o oneprobe ./cmd/oneprobe
      # Fidelity gate: the migrate dry-run on the committed Datadog
      # fixture must stay machine-stable — same input, same report keys.
      - name: migrate fixture gate (datadog)
        run: |
          ./oneprobe migrate --from=datadog --dry-run --format=json \
            --input testdata/fixtures/datadog/sample-dashboard.json > /tmp/report.json
          jq -e '.source=="datadog" and .dry_run==true
                 and (.mapped | length)==1
                 and (.partial | length)==2
                 and (.unmapped | length)==1
                 and (.risks | map(.key))==["query.anomalies","tags.scope","widget.synthetics"]
                 and (.mapped[0].widget_id)==1
                 and (.unmapped[0].widget_id)==4' /tmp/report.json
          # Same input twice must be byte-identical (the report is a CI contract).
          ./oneprobe migrate --from=datadog --dry-run --format=json \
            --input testdata/fixtures/datadog/sample-dashboard.json > /tmp/report2.json
          diff /tmp/report.json /tmp/report2.json
      # Refusals must name the rejected input, not dump usage.
      - name: migrate refusal gate
        run: |
          if ./oneprobe migrate --from=grafana --dry-run 2>&1 | grep -q "unsupported --from=grafana"; then
            echo "refusal names rejected source - OK"
          else
            echo "::error::migrate refusal does not name the rejected --from value"; exit 1
          fi
          if ./oneprobe migrate --from=datadog 2>&1 | grep -q -- "--dry-run"; then
            echo "non-dry-run refusal names --dry-run - OK"
          else
            echo "::error::migrate without --dry-run must name the flag"; exit 1
          fi
      # donate must print both addresses exactly (the binding monetization surface).
      - name: donate gate
        run: |
          ./oneprobe donate | grep -q "0x85ee7E71f762d772599cbF1EC20E651B30657521"
          ./oneprobe donate | grep -q "bc1qxe2zx5tv3hdreaej6s2x4p7han85uey828rrhg"
      # Query subset contract: the documented expressions evaluate; an
      # undocumented function is a 400 that names it.
      - name: query gate
        run: |
          ./oneprobe serve --db /tmp/qgate.db --http 127.0.0.1:18081 &
          SRV=$!
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:18081/healthz >/dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:18081/api/query?expr=sum(up)")
          [ "$code" = "200" ] || { echo "::error::sum(up) returned $code"; kill $SRV; exit 1; }
          curl -sf "http://127.0.0.1:18081/api/query?expr=up" | jq -e '.series' >/dev/null
          err=$(curl -s "http://127.0.0.1:18081/api/query?expr=histogram_quantile(0.9,x)")
          echo "$err" | grep -q 'unsupported function "histogram_quantile"' \
            || { echo "::error::bad expr not named: $err"; kill $SRV; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:18081/api/query?expr=histogram_quantile(0.9,x)")
          [ "$code" = "400" ] || { echo "::error::bad expr returned $code, want 400"; kill $SRV; exit 1; }
          kill $SRV
          rm -f /tmp/qgate.db*
      # Alerts contract: a rule that matches nothing stays resolved; a
      # violating rule fires; the API lists both states.
      - name: alert gate
        run: |
          ./oneprobe serve --db /tmp/agate.db --http 127.0.0.1:18082 &
          SRV=$!
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:18082/healthz >/dev/null && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:18082/api/alerts \
            -H 'Content-Type: application/json' \
            -d '{"name":"nothing","expr":"no_such_metric","op":"<","value":1,"enabled":true}' | jq -e '.id > 0'
          curl -sf -X POST http://127.0.0.1:18082/api/alerts \
            -H 'Content-Type: application/json' \
            -d '{"name":"bad-op","expr":"up","op":"~","value":1}' > /tmp/badop.json
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:18082/api/alerts \
            -H 'Content-Type: application/json' -d '{"name":"bad-op2","expr":"up","op":"~","value":1}')
          [ "$code" = "400" ] || { echo "::error::bad op returned $code"; kill $SRV; exit 1; }
          curl -sf http://127.0.0.1:18082/api/alerts | jq -e 'length==1 and .[0].state=="resolved"'
          kill $SRV
          rm -f /tmp/agate.db*
      # serve must boot, answer /healthz and /donate, 404 unbuilt
      # surfaces, and run the scrape loop end-to-end: register a
      # fixture target, see it scraped, query the samples back.
      - name: serve smoke (boot + scrape + query + shutdown)
        run: |
          mkdir -p /tmp/fixt
          printf '# HELP up Up\n# TYPE up gauge\nup 1\nci_metric_total 5\n' > /tmp/fixt/metrics
          (python3 -m http.server 19222 --directory /tmp/fixt >/dev/null 2>&1 &)
          ./oneprobe serve --db /tmp/ci.db --http 127.0.0.1:18080 &
          SRV=$!
          for i in $(seq 1 15); do curl -sf http://127.0.0.1:18080/healthz >/dev/null && break; sleep 1; done
          test "$(curl -sf http://127.0.0.1:18080/healthz)" = "ok"
          curl -sf http://127.0.0.1:18080/donate | grep -q "0x85ee7E71f762d772599cbF1EC20E651B30657521"
          curl -sf http://127.0.0.1:18080/donate | grep -q "bc1qxe2zx5tv3hdreaej6s2x4p7han85uey828rrhg"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/api/logs)
          if [ "$code" = "404" ]; then echo "unbuilt API surface 404s - OK"; else echo "::error::/api/logs returned $code, want 404"; kill $SRV; exit 1; fi
          # Register the fixture target with a 1s interval.
          curl -sf -X POST http://127.0.0.1:18080/api/targets \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","url":"http://127.0.0.1:19222/metrics","interval":1000}' \
            | grep -q '"interval":1000'
          # Wait for the loop to scrape twice, then query the samples.
          for i in $(seq 1 20); do
            n=$(curl -sf http://127.0.0.1:18080/api/targets/1/scrapes | jq 'length')
            [ "$n" -ge 2 ] && break; sleep 1
          done
          [ "$n" -ge 2 ] || { echo "::error::target not scraped twice in 20s"; kill $SRV; exit 1; }
          curl -sf http://127.0.0.1:18080/api/targets/1/scrapes | jq -e '.[0].ok==true and .[0].sample_count==2'
          curl -sf "http://127.0.0.1:18080/api/query?metric=ci_metric_total" | jq -e '.metric=="ci_metric_total" and (.points | length) >= 2'
          # UI page serves with the graph panel, both addresses, and
          # every GUI screen's hooks.
          curl -sf http://127.0.0.1:18080/ | grep -q 'id="graph"'
          curl -sf http://127.0.0.1:18080/ | grep -q 'id="migrate-heading"'
          curl -sf http://127.0.0.1:18080/ | grep -q 'id="alert-history"'
          curl -sf http://127.0.0.1:18080/ | grep -q 'id="retention-note"'
          curl -sf http://127.0.0.1:18080/ | grep -q "0x85ee7E71f762d772599cbF1EC20E651B30657521"
          curl -sf http://127.0.0.1:18080/ | grep -q "bc1qxe2zx5tv3hdreaej6s2x4p7han85uey828rrhg"
          # Donate page is the HTML GUI with copy buttons, no payment form.
          curl -sf http://127.0.0.1:18080/donate | grep -q "text/html"
          curl -sf http://127.0.0.1:18080/donate | grep -qi "copy"
          # Migrate dry-run through the GUI's endpoint (bad JSON named).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:18080/api/migrate/datadog \
            -H 'Content-Type: application/json' -d '{"widgets":[]}')
          [ "$code" = "200" ] || { echo "::error::migrate endpoint returned $code"; kill $SRV; exit 1; }
          curl -sf -X POST http://127.0.0.1:18080/api/migrate/datadog \
            -H 'Content-Type: application/json' -d '{"id":"x","title":"t","widgets":[]}' \
            | jq -e '.source=="datadog" and .dry_run==true'
          err=$(curl -s -X POST http://127.0.0.1:18080/api/migrate/datadog \
            -H 'Content-Type: application/json' -d '{bad json')
          echo "$err" | grep -q "not a valid Datadog dashboard export" \
            || { echo "::error::bad migrate input not named: $err"; kill $SRV; exit 1; }
          # Alert history endpoint: empty is [] never null.
          curl -sf http://127.0.0.1:18080/api/alerts/1/history | jq -e 'type=="array"'
          kill $SRV
          rm -f /tmp/ci.db*
      # The documented deploy path must build.
      - name: docker build
        run: docker build -t oneprobe-ci .
